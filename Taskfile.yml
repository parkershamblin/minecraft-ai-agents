# Cross-repo task orchestrator (go-task). Single binary, embeds its own POSIX
# shell — the same task runs identically in PowerShell, Git Bash, and CI.
# npm scripts stay inside each Node package for package-local concerns.
version: "3"

dotenv: [".env"]

vars:
  COMPOSE: docker compose -f infrastructure/docker/docker-compose.yml --env-file .env

tasks:
  up:
    desc: Start the infra profile (Postgres, Redis, Redpanda, Prometheus, Grafana) — healthcheck-gated, then provision topics
    cmds:
      - "{{.COMPOSE}} --profile infra up -d --wait"
      - node scripts/provision-topics.mjs

  up:all:
    desc: Infra + app profiles (app entries land with each service's first feature). Infra first, then topics, THEN app — explicit provisioning must beat the producers' auto-create race on a fresh cluster
    cmds:
      - "{{.COMPOSE}} --profile infra up -d --wait"
      - node scripts/provision-topics.mjs
      - "{{.COMPOSE}} --profile infra --profile app up -d --wait"

  topics:
    desc: Provision the Kafka topic map explicitly (idempotent; fails loud on partition mismatch — see docs/runbooks/kafka-topic-migration.md)
    cmds:
      - node scripts/provision-topics.mjs

  down:
    desc: Stop everything (volumes preserved)
    cmds:
      - "{{.COMPOSE}} --profile infra --profile app --profile minecraft down"

  nuke:
    desc: Stop everything AND delete volumes — fresh world
    prompt: This deletes all local data volumes. Continue?
    cmds:
      - "{{.COMPOSE}} --profile infra --profile app --profile minecraft down -v"

  logs:
    desc: Tail all container logs
    cmds:
      - "{{.COMPOSE}} logs -f --tail=100"

  smoke:
    desc: "Version-pin canary: one throwaway bot connects to the MC server, chats, disconnects"
    cmds:
      - node scripts/smoke.js

  dashboard:
    desc: "Next.js dashboard dev server on :3000 — host-run BY DECISION (#78): fast HMR wins over compose parity, and Windows bind mounts forward no inotify (containerized dev-watch would need polling). Needs root `npm install`; live data needs the app profile up"
    cmds:
      - npm run dev --workspace apps/dashboard

  gen:
    desc: Regenerate TS/Python types from packages/events schemas (output is committed; CI drift-checks it)
    cmds:
      - npm run gen --workspace @civ/events

  seed:
    desc: Provision villagers.json (first VILLAGER_COUNT), emit VillagerCreated, spawn bots, start tick loops
    cmds:
      - curl -s -X POST http://localhost:8001/internal/seed

  dev:up:
    desc: "Fast cycle: infra + app with HOT-RELOAD (bind-mounted src; agent-service uvicorn --reload, minecraft-service tsx watch). Edit prompts.py/*.ts, service reloads in ~1s, no rebuild. NOT a deploy path — rebuild from main (task up:all) before any honest/filmed race"
    cmds:
      - "{{.COMPOSE}} --profile infra up -d --wait"
      - node scripts/provision-topics.mjs
      - "{{.COMPOSE}} -f infrastructure/docker/docker-compose.dev.yml --profile infra --profile app up -d"

  # --- Races / benchmarks (see: node scripts/civ-bench.mjs --help) ---
  bench:
    desc: "Unified benchmark CLI help / dispatch. Args after -- go to civ-bench.mjs (list|race|drill|…)"
    cmds:
      - node scripts/civ-bench.mjs {{.CLI_ARGS}}

  race:
    desc: "Full 3v3 Red-vs-Blue race (race-rb2). Needs compose Paper + 6 seeded racers. Extra flags after --"
    cmds:
      - node scripts/civ-bench.mjs race {{.CLI_ARGS}}

  race:practice:
    desc: "RB-2 race with --practice (skips hard budget/tick preset checks). Extra flags after --"
    cmds:
      - node scripts/civ-bench.mjs race:practice {{.CLI_ARGS}}

  race:drill:
    desc: "Fast LIVE brain drill — one bot, staged arena (drill-rb2). Args: --bot Elara --stall-minutes 8"
    cmds:
      - node scripts/civ-bench.mjs drill {{.CLI_ARGS}}

  race:drill:body:
    desc: "RB-1 body/rig drill — staged world, raw command plane, no LLM (drill-rb1)"
    cmds:
      - node scripts/civ-bench.mjs drill:body {{.CLI_ARGS}}

  race:replay:
    desc: "Offline race-brain replay (Ollama, no world). Args: --rung bare|coal|iron|furnace|ingot|win|all --n 20"
    cmds:
      - node scripts/civ-bench.mjs replay {{.CLI_ARGS}}

  race:skill-bench:
    desc: "Ported-skill iron_pickaxe chain (no LLM). Host MC :25565, script pinned to 1.21.6. Args: [runs]"
    cmds:
      - node scripts/civ-bench.mjs skill-bench {{.CLI_ARGS}}

  race:sweep:
    desc: "Honesty-gated model/axis sweep. Requires --world-snapshot path. See docs/runbooks/race-sensitivity-sweep.md"
    cmds:
      - node scripts/civ-bench.mjs sweep {{.CLI_ARGS}}

  race:aggregate:
    desc: "Rebuild RACE_REPORT.md / AXIS_REPORT.md from bench/results/sweep"
    cmds:
      - node scripts/civ-bench.mjs aggregate {{.CLI_ARGS}}

  test:
    desc: Run all test suites (contracts, minecraft, agent, memory, event, government, bench)
    vars:
      # .\gradlew.bat (explicit path, double-backslash survives the POSIX
      # shell): bare batch names fail under NoDefaultCurrentDirectoryInExePath=1
      # (agent/hardened shells); the explicit form works everywhere.
      GRADLEW: '{{if eq OS "windows"}}cmd /c .\\gradlew.bat{{else}}./gradlew{{end}}'
    cmds:
      - npm test --workspace @civ/events
      - npm test --workspace @civ/minecraft-service
      - cd services/agent-service && uv run pytest -q
      - cd services/memory-service && uv run pytest -q
      - cd services/event-service && {{.GRADLEW}} test
      - cd services/government-service && {{.GRADLEW}} test
      # bench has no pyproject by design (stdlib + --with deps); the golden
      # test gates the RB-race metric extractor against film/flagship-slice.json
      - cd bench && uv run --python 3.12 --with pytest pytest -q
